<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Memories Board & Feedback ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Permanent+Marker&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cork: #b88655;
            --pink-accent: #ff85a2;
            --blue-accent: #4895ef;
        }

        body {
            margin: 0;
            background-color: var(--cork);
            background-image: url('https://www.transparenttextures.com/patterns/cork-board.png');
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container Papan */
        .board {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 1200px;
        }

        /* Judul Gaya Scrapbook */
        .board-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            font-family: 'Permanent Marker', cursive;
            font-size: 3.5rem;
            background: #fff;
            padding: 5px 30px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            z-index: 10;
        }

        /* Polaroid Bertumpuk */
        .polaroid {
            position: absolute;
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            border: 1px solid #ddd;
            transition: 0.3s;
            z-index: 1;
        }

        .polaroid img {
            width: 140px;
            height: 140px;
            object-fit: cover;
        }

        .polaroid:hover {
            transform: scale(1.1) rotate(0deg) !important;
            z-index: 100 !important;
        }

        /* Sticky Note Tengah untuk Akses */
        .sticky-note {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(3deg);
            background: #fffeb3;
            width: 280px;
            padding: 30px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.2);
            text-align: center;
            z-index: 50;
            border-bottom-right-radius: 60px 5px;
        }

        .sticky-note input {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 2px dashed #ff85a2;
            text-align: center;
            border-radius: 10px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-open { background: var(--pink-accent); color: white; }

        /* MODAL PESAN & FEEDBACK */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            padding: 40px;
            border-radius: 30px;
            z-index: 200;
            text-align: center;
            box-shadow: 0 0 100px rgba(0,0,0,0.6);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .theme-cewe { background: #fff0f3; border: 5px solid #ffb3c1; color: #ff4d6d; }
        .theme-cwo { background: #eefbff; border: 5px solid #bde0fe; color: #4895ef; }

        textarea {
            width: 100%;
            height: 80px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            padding: 10px;
            font-family: inherit;
        }

        .btn-send { background: #333; color: white; margin-top: 10px; }
    </style>
</head>
